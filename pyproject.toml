[project]
name = "cropper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "napari[all]>=0.8.0",
    "tifffile>=2026.7.14",
    "xarray>=2026.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cropper"]

[project.entry-points."napari.manifest"]
cropper = "cropper:napari.yaml"